[project]
name = "thyforce"
version = "0.1.0"
description = "personal hy garden"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hy>=1.3.0",
    "hyrule>=1.0.1",
    "pyrsistent>=0.20.0",
    "toolz>=1.1.0",
    "typeshed-client>=2.11.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]
