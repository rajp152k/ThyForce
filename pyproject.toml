[project]
name = "thyforce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hy>=1.3.0",
    "hyrule>=1.0.1",
    "toolz>=1.1.0",
]

[dependency-groups]
dev = [
    "polylith-cli>=1.47.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]
