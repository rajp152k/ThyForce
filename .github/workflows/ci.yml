name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  polylith-and-tests:
    name: Polylith checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Polylith workspace check
        run: uvx --from ./projects/polhy polhy check

      - name: Run Polylith dependency report
        run: uvx --from ./projects/polhy polhy deps

      - name: Run test suites
        run: uvx --from ./projects/polhy polhy test
