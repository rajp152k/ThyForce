[project]
name = "hyground"
version = "0.1.0"
description = "HyGround - a principled Hy language server (Polylith project)"
requires-python = ">=3.14"
dependencies = [
    "hy>=1.3.0",
    "typeshed-client>=2.11.0",
]

[project.scripts]
hyground = "thyforce.lsp.server.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../components/thyforce/__init__.py" = "thyforce/__init__.py"
"../../components/thyforce/dispatch" = "thyforce/dispatch"
"../../components/thyforce/lsp/__init__.py" = "thyforce/lsp/__init__.py"
"../../components/thyforce/lsp/analyzer" = "thyforce/lsp/analyzer"
"../../components/thyforce/lsp/engine" = "thyforce/lsp/engine"
"../../components/thyforce/lsp/providers" = "thyforce/lsp/providers"
"../../bases/thyforce/lsp/server" = "thyforce/lsp/server"
"../../components/thyforce/spec" = "thyforce/spec"
