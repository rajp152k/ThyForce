[project]
name = "hyground"
version = "0.1.0"
description = "HyGround - a principled Hy language server (Polylith project)"
requires-python = ">=3.14"
dependencies = [
    "hy>=1.3.0",
    "typeshed-client>=2.11.0",
]

[project.scripts]
hyground = "thyforce.lsp.server.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Polylith project: compose the bricks this deployable ships. Paths are relative
# to this file and reach up into the workspace root (components/ and bases/).
# Only the LSP bricks + spec are shipped here; polhy and other bricks are excluded.
[tool.hatch.build.targets.wheel.force-include]
"../../components/thyforce/__init__.py" = "thyforce/__init__.py"
"../../components/thyforce/lsp" = "thyforce/lsp"
"../../components/thyforce/spec" = "thyforce/spec"
"../../bases/thyforce/lsp/server" = "thyforce/lsp/server"
