[project]
name = "polhy"
version = "0.1.0"
description = "polhy - in-repo Polylith tooling for Hy workspaces (Polylith project)"
requires-python = ">=3.14"
dependencies = [
    "hy>=1.3.0",
]

[project.scripts]
polhy = "thyforce.polhy.cli.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Polylith project: compose the bricks this deployable ships. Paths are relative
# to this file and reach up into the workspace root (components/ and bases/).
# Ships only the polhy component + its CLI base.
[tool.hatch.build.targets.wheel.force-include]
"../../components/thyforce/__init__.py" = "thyforce/__init__.py"
"../../components/thyforce/polhy" = "thyforce/polhy"
"../../bases/thyforce/polhy/cli" = "thyforce/polhy/cli"
